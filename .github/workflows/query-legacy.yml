name: Query Legacy Tables
on: workflow_dispatch
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Query legacy tables
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            set -e
            cd /root/paridade-risco-v2

            cat > /tmp/query.cjs << 'SCRIPT'
const {sql} = require('postgres');
const pg = sql(process.env.DATABASE_URL);
(async () => {
  try {
    const [users, baskets] = await Promise.all([
      pg`select id, name, email, role, "selectedBasketId" from "User"`,
      pg`select id, name, "userId" from "Cesta"`,
    ]);
    console.log('USERS:', JSON.stringify(users));
    console.log('CESTAS:', JSON.stringify(baskets));
  } catch(e) { console.error('Error:', e.message); }
  finally { await pg.end(); }
})();
SCRIPT

            docker compose cp /tmp/query.cjs app:/tmp/query.cjs
            docker compose exec -T app node /tmp/query.cjs
            docker compose exec -T app rm /tmp/query.cjs
          "
