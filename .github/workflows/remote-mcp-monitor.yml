name: Remote MCP Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Public API and MCP route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate public API and MCP route
        run: npm run smoke:remote-mcp
        env:
          MCP_PUBLIC_URL: https://paridaderisco.blackboxinovacao.com.br
