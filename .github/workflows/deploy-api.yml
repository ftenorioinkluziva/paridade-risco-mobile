name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REMOTE_DIR: /root/paridade-risco-v2
  CODE_DIR: /root/paridade-risco-v2/code

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -az --no-t --delete \
            --include='*/' \
            --include='package.json' \
            --include='package-lock.json' \
            --include='apps/api/Dockerfile' \
            --include='apps/api/docker-compose.hetzner.yml' \
            --include='apps/api/.env.production' \
            --include='apps/api/drizzle.config.ts' \
            --include='apps/api/next.config.ts' \
            --include='apps/api/tsconfig.json' \
            --include='apps/api/src/**' \
            --include='apps/api/drizzle/**' \
            --include='apps/api/public/**' \
            --include='packages/shared/**' \
            --exclude='*' \
            ./ root@${{ secrets.SSH_HOST }}:$CODE_DIR/

      - name: Install deps & build
        run: |
          ssh root@${{ secrets.SSH_HOST }} "cd $CODE_DIR && rm -rf node_modules && DATABASE_URL='${{ secrets.DATABASE_URL }}' npm ci && DATABASE_URL='${{ secrets.DATABASE_URL }}' npm run build --workspace=@paridade-risco/api"

      - name: Fix & Build Docker image
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            cd $CODE_DIR
            sed -i 's# 2>/dev/null || true##g' apps/api/Dockerfile
            docker build -f apps/api/Dockerfile -t paridade-risco-api:latest --build-arg DATABASE_URL='${{ secrets.DATABASE_URL }}' .
          "

      - name: Deploy container
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            cd $REMOTE_DIR
            cp code/apps/api/docker-compose.hetzner.yml docker-compose.yml
            cp code/apps/api/.env.production .env 2>/dev/null || true
            docker compose down 2>/dev/null || true
            docker compose up -d
          "

      - name: Debug container
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            docker compose exec -T app node -e 'console.log(\"node ok\")' 2>&1
            docker compose exec -T app ls /app/apps/api/drizzle.config.ts 2>&1
            docker compose exec -T app stat /app/node_modules/.bin/drizzle-kit 2>&1
            docker compose exec -T app which drizzle-kit 2>&1 || echo 'drizzle-kit not in PATH'
            docker compose exec -T app which tsx 2>&1 || echo 'tsx not in PATH'
          "

      - name: Run migrations
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            sleep 5
            docker compose exec -T -w /app/apps/api app drizzle-kit migrate 2>&1 || echo 'Migration note'
          "

      - name: Seed test user
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            docker compose exec -T -w /app/apps/api app tsx src/db/seed.ts 2>&1 || echo 'Seed failed'
          "

      - name: Health check
        run: |
          sleep 5
          curl -sf https://paridaderisco.blackboxinovacao.com.br/api/health && echo "Health OK" || echo "Health endpoint not found"
