name: Deploy API

# Trigger: push to master on monitored paths

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "apps/remote-mcp/**"
      - "packages/shared/**"
      - "packages/cli/**"
      - "packages/local-mcp/**"
      - "packages/telegram-bot/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REMOTE_DIR: /opt/paridade-risco-mobile
  CODE_DIR: /opt/paridade-risco-mobile/repo

jobs:
  quality:
    name: Quality gates before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build API with ephemeral build secret
        env:
          BETTER_AUTH_SECRET: build-stage-placeholder-never-used-at-runtime
        run: npm run build:api

  deploy:
    name: Build & Deploy
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest code
        run: |
          ssh root@${{ secrets.SSH_HOST }} "cd $CODE_DIR && git pull --ff-only origin master"

      - name: Create telegram-bot .env
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            set -eu
            mkdir -p $CODE_DIR/packages/telegram-bot
            touch $REMOTE_DIR/.env
            TELEGRAM_S2S_SECRET_VALUE=\$(grep '^TELEGRAM_S2S_SECRET=' $REMOTE_DIR/.env | head -1 | cut -d= -f2- || true)
            if [ -z \"\$TELEGRAM_S2S_SECRET_VALUE\" ]; then
              TELEGRAM_S2S_SECRET_VALUE=\$(openssl rand -hex 32)
              printf '\nTELEGRAM_S2S_SECRET=%s\n' \"\$TELEGRAM_S2S_SECRET_VALUE\" >> $REMOTE_DIR/.env
            fi
            printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_S2S_SECRET=%s\n' '${{ secrets.TELEGRAM_BOT_TOKEN }}' \"\$TELEGRAM_S2S_SECRET_VALUE\" > $CODE_DIR/packages/telegram-bot/.env
            chmod 600 $REMOTE_DIR/.env $CODE_DIR/packages/telegram-bot/.env
          "

      - name: Build Docker images
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            cd $CODE_DIR
            DB_URL=\$(grep '^DATABASE_URL=' $REMOTE_DIR/.env | head -1 | cut -d= -f2-)
            docker image prune -f 2>/dev/null || true
            docker build -f apps/api/Dockerfile -t paridade-risco-api:latest --build-arg DATABASE_URL=\"\$DB_URL\" .
            docker build -f packages/telegram-bot/Dockerfile -t paridade-risco-telegram-bot:latest packages/telegram-bot
          "

      - name: Deploy container
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            cd $REMOTE_DIR
            docker compose up -d --remove-orphans
          "

      - name: Run migrations
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            cd $REMOTE_DIR
            for i in \$(seq 1 20); do
              docker compose exec -T -w /app/apps/api app /app/node_modules/.bin/drizzle-kit migrate && break
              echo 'API not ready, waiting 5s... (attempt \$i/20)'
              sleep 5
            done
          "

      - name: Health check
        run: |
          sleep 5
          curl -sf https://paridaderisco.blackboxinovacao.com.br/api/health && echo "API Health OK" || echo "API Health FAIL"
          ssh root@${{ secrets.SSH_HOST }} "docker ps --filter name=paridade-risco-telegram-bot --format '{{.Status}}' | grep -q Up && echo 'Bot Health OK' || echo 'Bot Health FAIL'"

      - name: Build & Deploy remote-mcp
        run: |
          ssh root@${{ secrets.SSH_HOST }} "
            cd $CODE_DIR
            docker compose --project-name remote-mcp -f apps/remote-mcp/docker-compose.yml down --remove-orphans 2>/dev/null || true
            echo 'Using port 3050 for remote-mcp'
            (ufw status && ufw allow 3050/tcp) || echo 'ufw not available'
            MCP_PORT=3050 docker compose --project-name remote-mcp -f apps/remote-mcp/docker-compose.yml --env-file $REMOTE_DIR/.env up -d --build
            echo '=== Testing remote-mcp locally ==='
            sleep 3
            curl -sf --connect-timeout 5 http://127.0.0.1:3050/ && echo 'Local OK' || echo 'Local FAIL'
            docker image prune -f 2>/dev/null || true
          "

      - name: Configure NPM proxy for remote-mcp
        run: |
          ssh root@${{ secrets.SSH_HOST }} "cd $CODE_DIR && REMOTE_DIR=$REMOTE_DIR CODE_DIR=$CODE_DIR bash apps/remote-mcp/scripts/configure-npm.sh"

      - name: Smoke public Remote MCP route
        uses: actions/checkout@v6

      - name: Validate public API and MCP route
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run Remote MCP smoke
        run: npm run smoke:remote-mcp
        env:
          MCP_PUBLIC_URL: https://paridaderisco.blackboxinovacao.com.br
