services:
  postgres:
    image: postgres:16-alpine
    container_name: paridade-risco-db
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: paridade
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paridade}
      POSTGRES_DB: paridade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paridade"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paridade-risco-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        DATABASE_URL: postgresql://paridade:${DB_PASSWORD:-paridade}@postgres:5432/paridade
    image: paridade-risco-api:latest
    container_name: paridade-risco-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3002}:3000"
    user: root
    environment:
      DATABASE_URL: postgresql://paridade:${DB_PASSWORD:-paridade}@postgres:5432/paridade
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${API_PORT:-3002}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${API_PORT:-3002}}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002}
      LEGACY_SESSION_AUTH_ENABLED: ${LEGACY_SESSION_AUTH_ENABLED:-false}
      LEGACY_SESSION_AUTH_CLI_ENABLED: ${LEGACY_SESSION_AUTH_CLI_ENABLED:-false}
      TELEGRAM_LEGACY_SESSION_ROLLBACK_ENABLED: ${TELEGRAM_LEGACY_SESSION_ROLLBACK_ENABLED:-false}
      TELEGRAM_S2S_AUTH_ENABLED: ${TELEGRAM_S2S_AUTH_ENABLED:-true}
      TELEGRAM_S2S_SECRET: ${TELEGRAM_S2S_SECRET:-local-development-telegram-s2s-secret-32-bytes}
      TELEGRAM_S2S_PREVIOUS_SECRET: ${TELEGRAM_S2S_PREVIOUS_SECRET:-}
      PLUGGY_ENVIRONMENT: ${PLUGGY_ENVIRONMENT:-sandbox}
      PLUGGY_API_BASE_URL: ${PLUGGY_API_BASE_URL:-https://api.pluggy.ai}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_SANDBOX_ITEM_ID: ${PLUGGY_SANDBOX_ITEM_ID:-}
      PLUGGY_SYNC_USER_ID: ${PLUGGY_SYNC_USER_ID:-}
      PLUGGY_ENABLE_PRODUCTION: ${PLUGGY_ENABLE_PRODUCTION:-false}
      PLUGGY_IGNORE_MANUAL_RECONCILIATION: ${PLUGGY_IGNORE_MANUAL_RECONCILIATION:-false}
      PLUGGY_WEBHOOK_SECRET: ${PLUGGY_WEBHOOK_SECRET:-}
      PLUGGY_WEBHOOK_HEADER: ${PLUGGY_WEBHOOK_HEADER:-x-pluggy-webhook-secret}
      BRAPI_API_TOKEN: ${BRAPI_API_TOKEN:-}
      npm_config_cache: /tmp/npm-cache
      NODE_ENV: production
    working_dir: /app/apps/api
    command: sh -c "npx tsx src/db/migrate.ts && node server.js"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paridade-risco-network

  price-scheduler:
    image: paridade-risco-api:latest
    container_name: paridade-risco-price-scheduler
    restart: unless-stopped
    user: root
    environment:
      DATABASE_URL: postgresql://paridade:${DB_PASSWORD:-paridade}@postgres:5432/paridade
      NODE_ENV: production
      BRAPI_API_TOKEN: ${BRAPI_API_TOKEN:-}
      PRICE_SCHEDULER_CRON_QUOTES: ${PRICE_SCHEDULER_CRON_QUOTES:-*/8 10-16 * * 1-5}
      PRICE_SCHEDULER_CRON_FINAL_CAPTURE: ${PRICE_SCHEDULER_CRON_FINAL_CAPTURE:-30 17 * * 1-5}
      PRICE_SCHEDULER_HOLIDAYS: ${PRICE_SCHEDULER_HOLIDAYS:-}
      PRICE_SCHEDULER_TIMEZONE: America/Sao_Paulo
      npm_config_cache: /tmp/npm-cache
    working_dir: /app/apps/api
    command: sh -c "npx tsx src/scripts/price-scheduler.ts --run-on-start"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - paridade-risco-network

  pluggy-scheduler:
    image: paridade-risco-api:latest
    container_name: paridade-risco-pluggy-scheduler
    restart: unless-stopped
    user: root
    environment:
      DATABASE_URL: postgresql://paridade:${DB_PASSWORD:-paridade}@postgres:5432/paridade
      PLUGGY_ENVIRONMENT: ${PLUGGY_ENVIRONMENT:-sandbox}
      PLUGGY_API_BASE_URL: ${PLUGGY_API_BASE_URL:-https://api.pluggy.ai}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_SANDBOX_ITEM_ID: ${PLUGGY_SANDBOX_ITEM_ID:-}
      PLUGGY_SYNC_USER_ID: ${PLUGGY_SYNC_USER_ID:-}
      PLUGGY_ENABLE_PRODUCTION: ${PLUGGY_ENABLE_PRODUCTION:-false}
      PLUGGY_IGNORE_MANUAL_RECONCILIATION: ${PLUGGY_IGNORE_MANUAL_RECONCILIATION:-false}
      PLUGGY_SYNC_CRON: ${PLUGGY_SYNC_CRON:-*/30 * * * *}
      PLUGGY_SYNC_TIMEZONE: ${PLUGGY_SYNC_TIMEZONE:-America/Sao_Paulo}
      PLUGGY_SYNC_RUN_ON_START: ${PLUGGY_SYNC_RUN_ON_START:-false}
      npm_config_cache: /tmp/npm-cache
      NODE_ENV: production
    working_dir: /app/apps/api
    command: sh -c "npx tsx src/scripts/pluggy-scheduler.ts"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - paridade-risco-network

  pluggy-webhook-worker:
    image: paridade-risco-api:latest
    container_name: paridade-risco-pluggy-webhook-worker
    restart: unless-stopped
    user: root
    environment:
      DATABASE_URL: postgresql://paridade:${DB_PASSWORD:-paridade}@postgres:5432/paridade
      PLUGGY_ENVIRONMENT: ${PLUGGY_ENVIRONMENT:-sandbox}
      PLUGGY_API_BASE_URL: ${PLUGGY_API_BASE_URL:-https://api.pluggy.ai}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_ENABLE_PRODUCTION: ${PLUGGY_ENABLE_PRODUCTION:-false}
      PLUGGY_WEBHOOK_POLL_MS: ${PLUGGY_WEBHOOK_POLL_MS:-5000}
      PLUGGY_WEBHOOK_MAX_ATTEMPTS: ${PLUGGY_WEBHOOK_MAX_ATTEMPTS:-5}
      npm_config_cache: /tmp/npm-cache
      NODE_ENV: production
    working_dir: /app/apps/api
    command: sh -c "npx tsx src/scripts/pluggy-webhook-worker.ts"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - paridade-risco-network

  remote-mcp:
    build:
      context: .
      dockerfile: apps/remote-mcp/Dockerfile
    image: paridade-risco-remote-mcp:latest
    container_name: paridade-risco-remote-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-3050}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PARIDADE_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - paridade-risco-network

  telegram-bot:
    build:
      context: ./packages/telegram-bot
    image: paridade-risco-telegram-bot:latest
    container_name: paridade-risco-telegram-bot
    restart: unless-stopped
    env_file:
      - ./packages/telegram-bot/.env
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL: "2000"
      TELEGRAM_S2S_SECRET: ${TELEGRAM_S2S_SECRET:-local-development-telegram-s2s-secret-32-bytes}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - paridade-risco-network

volumes:
  postgres-data:

networks:
  paridade-risco-network:
    driver: bridge
